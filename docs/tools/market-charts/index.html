<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マーケットチャート</title>

<!-- Clickjacking defense (frame-busting) -->
<style id="antiClickjack">html{display:none !important;}</style>
<script>
(function(){
  if (self === top) {
    var s = document.getElementById('antiClickjack');
    if (s && s.parentNode) s.parentNode.removeChild(s);
  } else {
    try { top.location = self.location; } catch (e) {}
    try { document.documentElement.innerHTML = ''; } catch (e) {}
  }
})();
</script>

<style>
body{font-family:system-ui,-apple-system,sans-serif;margin:0;padding:20px;background:#121212;color:#e0e0e0}
h1{text-align:center;color:#fff}
.tabs{display:flex;justify-content:center;gap:10px;margin-bottom:30px;flex-wrap:wrap}
.tabs button{background:#2a2f3a;color:#e0e0e0;border:1px solid #444;border-radius:8px;padding:8px 18px;font-size:1em;cursor:pointer}
.tabs button.on{background:#2962ff;border-color:#2962ff;color:#fff}
.panel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px;max-width:1350px;margin:0 auto}
.chart-box{background:#1e2128;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.4);overflow:hidden;width:100%;max-width:400px;margin:0 auto}
.chart-title{margin:0;padding:18px 25px 10px;background:#2a2f3a;font-size:1.35em;font-weight:600;border-bottom:1px solid #333;color:#fff}
.tradingview-widget-container{height:432px !important}
.tradingview-widget-container__widget{height:calc(100% - 32px)}
.tradingview-widget-copyright{text-align:center;font-size:13px;line-height:32px;color:#aaa}

.linkonly{text-align:center;padding:30px 15px;color:#aaa;font-size:.9em;line-height:1.8}
.linkonly a{color:#2962ff;font-size:1.1em}
.tradingview-widget-copyright a{color:#2962ff;text-decoration:none}
footer{text-align:center;margin-top:60px;font-size:.9em;color:#888}
footer a{color:#888}
@media (max-width:1100px){.panel{grid-template-columns:1fr}}
@media (max-width:480px){body{padding:12px}}
</style>
<!-- Cloudflare Web Analytics --><script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "219971a8b25d4506877afc0a72110eb1"}'></script><!-- End Cloudflare Web Analytics -->
</head>
<body>
<h1>マーケットチャート</h1>
<div class="tabs" id="tabs"></div>
<div id="charts"></div>

<hr />
<p>Written by Hajime Tsui</p>
<ul>
  <li>GitHubPage: <a href="https://hajimetwi3.github.io/hajimetwi3/">https://hajimetwi3.github.io/hajimetwi3/</a></li>
  <li>X (Twitter): <a href="https://x.com/hajimetwi3">https://x.com/hajimetwi3</a></li>
</ul>
<hr />
<footer>データは参考値です（※CFD版は実際の指数とほぼ連動）<br><a href="https://github.com/hajimetwi3/misc/blob/main/docs/tools/market-charts/index.html" target="_blank" rel="noopener">GitHubで編集</a></footer>

<script>
// [タブ名, [[タイトル, シンボル, 補足, ('link'なら埋め込まずリンクのみ)], ...]]
var TABS = [
  ['為替・商品', [
    ['ドル円', 'OANDA:USDJPY', ''],
    ['WTI原油', 'TVC:USOIL', ''],
    ['金/円', 'OANDA:XAUJPY', ''],
    ['銀/円', 'OANDA:XAGJPY', '']
  ]],
  ['株価指数', [
    ['ダウ平均', 'BLACKBULL:US30', ' ※CFD'],
    ['S&P500', 'CAPITALCOM:US500', ' ※CFD'],
    ['ナスダック', 'CAPITALCOM:US100', ' ※CFD'],
    ['日経225先物', 'OSE:NK2251!', '']
  ]],
  ['半導体', [
    ['半導体ETF SOXX', 'NASDAQ:SOXX', ''],
    ['SOXL 半導体3倍', 'AMEX:SOXL', ''],
    ['NVIDIA', 'NASDAQ:NVDA', ''],
    ['キオクシア', 'TSE:285A', '', 'link']  // 'link' = 埋め込み不可の銘柄。TradingViewへのリンクだけ表示
  ]],
  ['バイオ・製薬', [
    ['ファイザー', 'NYSE:PFE', ''],
    ['イーライリリー', 'NYSE:LLY', ''],
    ['メルク', 'NYSE:MRK', ''],
    ['アストラゼネカ', 'NYSE:AZN', ''],
    ['ノボ ノルディスク', 'NYSE:NVO', ' ※ADR'],
    ['アムジェン', 'NASDAQ:AMGN', ''],
    ['J&J', 'NYSE:JNJ', '']
  ]]
];

var panels = [];  // 一度作ったタブは捨てずに再利用（切替時は表示/非表示だけ）

function build(i) {
  var panel = document.createElement('div');
  panel.className = 'panel';
  TABS[i][1].forEach(function (c) {
    var url = 'https://jp.tradingview.com/symbols/' + c[1].replace(':', '-') + '/';
    var box = document.createElement('div');
    box.className = 'chart-box';
    box.innerHTML = '<div class="chart-title"></div><div class="tradingview-widget-container"><div class="tradingview-widget-container__widget"></div>'
      + '<div class="tradingview-widget-copyright"><a rel="noopener nofollow" target="_blank"><span class="blue-text"></span></a><span class="trademark"> by TradingView</span></div></div>';
    box.children[0].textContent = c[0] + '（' + c[1] + '）' + c[2];
    if (c[3] === 'link') {
      box.children[1].outerHTML = '<p class="linkonly"><a rel="noopener nofollow" target="_blank"></a><br>※この銘柄は埋め込み表示できないため、TradingViewで開きます</p>';
      var l = box.querySelector('.linkonly a');
      l.href = url;
      l.textContent = c[1].split(':')[1] + 'のチャートをTradingViewで見る';
      panel.appendChild(box);
      return;
    }
    var a = box.querySelector('.tradingview-widget-copyright a');
    a.href = url;
    a.firstChild.textContent = c[1].split(':')[1] + 'のチャート';
    var s = document.createElement('script');
    s.src = 'https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js';
    s.async = true;
    s.textContent = JSON.stringify({
      autosize: true, symbol: c[1], interval: '240',
      timezone: 'Asia/Tokyo', theme: 'dark', style: '1', locale: 'ja',
      allow_symbol_change: false, calendar: false, support_host: 'https://www.tradingview.com'
    });
    box.querySelector('.tradingview-widget-container').appendChild(s);
    panel.appendChild(box);
  });
  document.getElementById('charts').appendChild(panel);
  return panel;
}

function show(i) {
  if (!panels[i]) panels[i] = build(i);  // 初めて開いたタブだけ読み込む
  panels.forEach(function (p, j) { if (p) p.style.display = (i === j) ? '' : 'none'; });
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function (b, j) {
    b.className = (i === j) ? 'on' : '';
  });
}

TABS.forEach(function (t, i) {
  var b = document.createElement('button');
  b.textContent = t[0];
  b.onclick = function () { show(i); };
  document.getElementById('tabs').appendChild(b);
});
show(0);
</script>
</body>
</html>
